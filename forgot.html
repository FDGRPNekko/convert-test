<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление пароля — DOC</title>
  <meta name="theme-color" content="#07070d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="forgot">
<div id="site-header"></div>

<main class="auth-wrap">
  <div class="auth single reveal">
    <div class="auth-main">
      <div class="mail-big"><i data-i="key"></i></div>
      <h1>Восстановление пароля</h1>
      <p class="sub">Укажите почту, и мы отправим инструкцию по смене пароля.</p>

      <div class="alert ok" id="alert" role="status"><i data-i="check"></i><span></span></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Электронная почта</label>
          <div class="input-wrap">
            <i data-i="mail"></i>
            <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field-err" id="emailErr">Введите корректный адрес почты</div>
        </div>
        <button class="btn primary lg block" id="submit" type="submit"><span>Отправить инструкцию</span></button>
      </form>
      <div class="auth-foot"><a href="login.html">← Вернуться ко входу</a></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
